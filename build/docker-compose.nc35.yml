#
# Disposable Nextcloud 35 instance used to verify the app against the version
# declared in appinfo/info.xml <max-version>. Same pattern as the NC 34 compose
# next to it: its own project name, containers, port and volumes, so it cannot
# disturb the NC 33 development instance on 8080 or the NC 34 one on 8085.
#
#   docker compose -p folderprot-nc35 -f build/docker-compose.nc35.yml up -d
#   docker compose -p folderprot-nc35 -f build/docker-compose.nc35.yml down -v
#
# The -v on teardown matters: without it the volumes survive and the next up
# resumes the old instance instead of building a clean one. See build/README.md.
services:
  # NC 35 dropped MariaDB 10.6 (minimum is now 10.11 LTS) and MySQL 8.0
  # (minimum 8.4 LTS). The NC 34 compose pins 10.11, which is still supported;
  # 11.4 is used here so the instance is not sitting on the new floor.
  db:
    image: mariadb:11.4
    container_name: folderprot-nc35-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  # Redis matters here, not just for speed: ProtectionChecker uses
  # ICacheFactory::createDistributed(). Without a distributed backend that falls
  # back to APCu, which is NOT shared between the CLI and Apache — so cache
  # invalidation from an occ command cannot reach the web process, and a
  # protection added by CLI appears to do nothing for up to 300s. The dev
  # instance on 8080 has Redis; mirror it so results are comparable.
  redis:
    image: redis:alpine
    container_name: folderprot-nc35-redis
    restart: unless-stopped

  app:
    image: nextcloud:35-apache
    container_name: folderprot-nc35-app
    restart: unless-stopped
    ports:
      - 8086:80
    depends_on:
      - db
      - redis
    volumes:
      - nextcloud:/var/www/html
      # The whole apps/ tree, not just this app: the integration tests exercise
      # protected subfolders inside a group folder, which needs groupfolders.
      - ../..:/var/www/html/custom_apps
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=ncadmin
      - NEXTCLOUD_ADMIN_PASSWORD=folderprot-nc35-verify
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost

volumes:
  db:
  nextcloud:
